<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="고구려·백제·신라의 왕이 되어 삼국의 운명을 정하는 무료 역사 시뮬레이션. 당신의 선택이 역사를 바꿉니다. 설치 없이 바로 플레이.">
<meta name="theme-color" content="#120d08">
<meta property="og:type" content="website">
<meta property="og:site_name" content="三國王">
<meta property="og:title" content="三國王 — 역사를 바꾸는 왕의 결단">
<meta property="og:description" content="고구려·백제·신라의 왕이 되어 삼국의 운명을 정하는 무료 역사 시뮬레이션. 당신의 선택이 역사를 바꿉니다.">
<meta property="og:url" content="https://kjuhoho.github.io/samgukwang/">
<meta property="og:image" content="https://kjuhoho.github.io/samgukwang/assets/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="三國王 — 역사를 바꾸는 왕의 결단">
<meta name="twitter:description" content="삼국의 왕이 되어 역사를 바꿔 보세요. 무료, 설치 없이 바로 플레이.">
<meta name="twitter:image" content="https://kjuhoho.github.io/samgukwang/assets/og.png">
<title>三國王 — 역사를 바꾸는 왕의 결단</title>
<script>document.write('<link rel="stylesheet" href="css/game.css?v=' + Date.now() + '">');</script>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="hud">
    <div class="seal">王</div>
    <div class="who"><b>三國王</b><span>왕을 추첨하세요</span></div>
    <div id="res"></div>
    <button class="btn" id="btn-home" title="처음으로">⌂</button>
  </div>

  <div id="army"><h3><span>군제 · 병력</span><span></span></h3><div class="list"></div></div>
  <div id="chron"></div>

  <div id="mapctl"><button id="zin">＋</button><button id="zout">－</button><button id="zhome" title="전체 보기">◎</button><button id="ztk" class="on" title="병력·성 배치 표시 켜기/끄기">⚑</button></div>
  <div id="legend">
    <span style="--c:var(--c-goguryeo)">고구려</span><span style="--c:var(--c-baekje)">백제</span><span style="--c:var(--c-silla)">신라</span><span style="--c:var(--c-tang)">당</span><span style="--c:var(--c-wa)">왜</span>
  </div>
  <div id="pickbar"></div>
  <div id="tip"><button class="x">×</button></div>
  <div id="credit">지형: Natural Earth · AWS Terrain Tiles(SRTM 등) · 해안선은 현대 기준</div>

  <div id="title">
    <div>
      <div class="logo">三國王</div>
      <div class="kor">삼 국 왕</div>
      <p>고구려·백제·신라의 왕이 되어, 사료 속 분기점마다 결단하십시오.<br>당신의 선택이 역사를 바꿀 수 있습니다.</p>
      <div class="kings" id="kings"></div>
      <div id="lotmsg" style="min-height:24px;color:var(--gold2);font:700 15px var(--serif);margin:6px 0"></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn pri" id="btn-lot" style="padding:10px 22px;font-size:15px">운명의 추첨</button>
        <button class="btn" id="btn-uija" style="padding:10px 18px;font-size:15px">의자왕으로 바로 시작</button>
        <div style="flex-basis:100%;font-size:13px;opacity:.85;margin-top:6px">위의 왕 이름을 누르면 12명 중 원하는 왕으로 바로 시작할 수 있습니다. 추첨은 모든 왕이 한 번씩 나올 때까지 같은 왕이 다시 나오지 않습니다.</div>
      </div>
    </div>
  </div>
</div>

<script>
/* 캐시 문제 방지: 파일마다 버전 값을 붙여 순서대로 로드 (배포 시 V를 고정 문자열로 바꿔도 됨) */
(function () {
  var V = Date.now(), list = ["js/data/mapdata.js", "js/data/places.js", "js/data/deploy.js", "js/data/territories.js", "js/data/routes.js", "js/data/rosters.js", "js/data/generals.js", "js/data/commanders.js", "js/data/kings.js", "js/engine/map.js", "js/engine/game.js", "js/engine/tactics.js", "js/data/commands.js", "js/data/events.js", "js/data/events2.js", "js/data/events3.js", "js/data/events4.js", "js/data/events5.js", "js/data/events6.js", "js/data/events7.js", "js/data/events8.js", "js/data/events9.js", "js/engine/sandbox.js", "js/engine/advisor.js", "js/engine/deploy.js", "js/engine/council.js", "js/engine/auto.js", "js/engine/save.js", "js/engine/history.js", "js/engine/realism.js", "js/engine/threat.js", "js/engine/world.js", "js/engine/hard.js", "js/engine/cause.js", "js/engine/branch.js", "js/engine/naval.js", "js/engine/aiwar.js", "js/engine/aidev.js", "js/engine/intercept.js", "js/engine/ally.js", "js/engine/forces.js", "js/engine/geo.js", "js/engine/endless.js", "js/site.js", "js/i18n/i18n.js", "@DICT@", "js/data/scenario_uija.js", "js/data/scenario_uija_timeline.js", "js/data/sc_goguryeo.js", "js/data/sc_baekje.js", "js/data/sc_silla.js", "js/main.js"];
  var lg = null; try { lg = localStorage.getItem('samgukwang.lang'); } catch (e) { }
  if (lg !== 'ko' && lg !== 'ja' && lg !== 'en') { var nl = (navigator.language || 'ko').toLowerCase(); lg = nl.indexOf('ko') === 0 ? 'ko' : nl.indexOf('ja') === 0 ? 'ja' : 'en'; }
  var out = [];
  list.forEach(function (x) {
    if (x !== '@DICT@') { out.push(x); return; }
    if (lg === 'ko') return;
    ['cmd', 'evt', 'evt4', 'ui', 'names'].forEach(function (k) { out.push('js/i18n/dict_' + lg + '_' + k + '.js'); });
    out.push('js/i18n/dict_more.js'); out.push('js/i18n/dict_tr6.js');
    var SCP = { uija: 3, munmu: 1, bojang: 1, yeongyang: 1, seondeok: 1, gogukwon: 1, seong: 1, jinheung: 1, geunchogo: 1, garo: 1, nulji: 1, muyeol: 1 }; /* 시나리오 번역 파일 수 */
    Object.keys(SCP).forEach(function (id) { for (var n = 1; n <= SCP[id]; n++) out.push('js/i18n/sc/' + lg + '_' + id + '_' + n + '.js'); });
  });
  list = out;
  list.forEach(function (src) { document.write('<script src="' + src + '?v=' + V + '"><\/script>'); });
})();
</script>
</body>
</html>
